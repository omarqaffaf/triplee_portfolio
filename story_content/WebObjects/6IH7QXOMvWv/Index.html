<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Scroll</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: transparent;
      overflow-y: scroll;
    }
    .container {
      width: 100%;
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    img.loaded {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <img data-src="img1.png" alt="Image 1">
    <img data-src="img2.png" alt="Image 2">
    <img data-src="img3.png" alt="Image 3">
    <img data-src="img4.png" alt="Image 4">
    <img data-src="img5.png" alt="Image 5">
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const images = document.querySelectorAll('img[data-src]');
      
      const loadImage = (img) => {
        img.src = img.dataset.src;
        img.onload = () => {
          img.classList.add('loaded');
        };
      };

      const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            loadImage(img);
            observer.unobserve(img);
          }
        });
      }, {
        rootMargin: "100px",
        threshold: 0.1
      });

      images.forEach(img => observer.observe(img));
    });
  </script>
</body>
</html>
