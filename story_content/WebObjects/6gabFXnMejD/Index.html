<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Scroll</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: transparent;
      overflow-y: scroll;
    }
    .container {
      width: 100%;
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="img1.png" alt="Image 1">
    <img src="img2.png" alt="Image 2">
    <img src="img3.png" alt="Image 3">
    <img src="img4.png" alt="Image 4">
    <img src="img5.png" alt="Image 5">
    <img src="img6.png" alt="Image 6">
    <!-- Add more images as needed -->
  </div>
</body>
</html>
